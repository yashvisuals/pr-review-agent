spring:
  application:
    name: pr-review-agent

  # Virtual Threads - Java 21+ GA feature, zero thread pool tuning needed
  threads:
    virtual:
      enabled: true

  datasource:
    # Neon free tier: postgresql://user:pass@host.neon.tech/dbname?sslmode=require
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 5        # Neon free tier connection limit is low
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Upstash free tier: rediss://default:token@host.upstash.io:6380
      url: ${REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      lettuce:
        pool:
          max-active: 4
          max-idle: 2

  ai:
    openai:
      # Groq free tier: https://console.groq.com — no credit card, 6000 RPM
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.1
          max-tokens: 4096

# GitHub configuration
github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
  review:
    max-files-per-pr: 50
    max-diff-size-bytes: 500000
    post-inline-comments: true

# Review agent config
review:
  cache:
    ttl-minutes: 60
  analysis:
    parallel-dimensions: true
    dimensions:
      - SECURITY
      - BUGS
      - PERFORMANCE
      - CODE_QUALITY

# Actuator / observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    com.yash.prreview: INFO
    org.springframework.ai: WARN
